services:
  - type: web
    name: task-mng-frontend
    runtime: static
    buildCommand: cd frontend && npm run build
    publishPath: frontend/dist
    plan: free
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /sw.js
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /sw-push.js
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /manifest.webmanifest
        name: Content-Type
        value: application/manifest+json
    routes:
      - type: redirect
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://task-mng-sys-bqj2.onrender.com/api
