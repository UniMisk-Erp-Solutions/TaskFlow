<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google-site-verification" content="google0ae38d60af7ae322" />
    <title>TaskFlow — AI Task Manager</title>
    <!-- Aggressive no-store hints so a stale CDN edge / browser cache can never
         serve the previous index.html. Asset filenames are content-hashed so
         this only ever affects the entrypoint document. -->
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <!-- Google Identity Services — powers the "Connect Google Calendar" OAuth
         popup on the calendar page. Safe to load on every page; it does
         nothing until a button calls google.accounts.oauth2.initTokenClient. -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <!--
      Critical, deployment-resilient CSS.

      This block guarantees the marketing landing pages have a working layout
      EVEN IF the hashed Tailwind bundle is slow / cached / blocked by a CDN
      edge that hasn't picked up the latest build. It only sets the bare
      minimum that Tailwind utilities would otherwise be expected to provide.
      All values mirror the design tokens declared in src/index.css so light
      and dark mode still flip correctly via [data-theme] / .dark.
    -->
    <style id="taskflow-critical">
      :root {
        --background: #ffffff;
        --foreground: #020617;
        --card: #ffffff;
        --border: #e2e8f0;
        --muted: #475569;
        --accent: #f8fafc;
        --brand-primary: #8B5CF6;
        --brand-accent: #C084FC;
        color-scheme: light;
      }
      :root[data-theme="dark"], :root.dark {
        --background: #0b0e14;
        --foreground: #f8fafc;
        --card: #141820;
        --border: #1f2937;
        --muted: #94a3b8;
        --accent: #1e1b4b;
        color-scheme: dark;
      }
      *, *::before, *::after { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        background: var(--background);
        color: var(--foreground);
        font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: 16px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      h1, h2, h3, h4 {
        font-family: "Plus Jakarta Sans", "Inter", system-ui, sans-serif;
        font-weight: 600;
        letter-spacing: -0.025em;
        line-height: 1.15;
        margin: 0;
      }
      a { color: inherit; text-decoration: none; }
      button { font-family: inherit; }
      img, svg { display: block; max-width: 100%; }
      /* Spinner used during initial paint */
      .__pre_spinner {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        background: var(--background); z-index: 9999;
      }
      .__pre_spinner::after {
        content: ""; width: 24px; height: 24px; border-radius: 50%;
        border: 2px solid var(--border); border-top-color: var(--brand-primary);
        animation: __pre_spin 0.7s linear infinite;
      }
      @keyframes __pre_spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="__pre_spinner" aria-label="Loading TaskFlow"></div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
