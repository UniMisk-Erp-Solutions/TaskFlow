<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" href="/task-logo.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- PWA: installable on Android (Chrome/Edge/Samsung) and iOS (Safari -> Add to Home Screen). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#5645d4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0e14" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="TaskFlow" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="application-name" content="TaskFlow" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="google-site-verification" content="google0ae38d60af7ae322" />
    <!-- SEO: replaced at build time with each page's own title, description, canonical, social tags and structured data
         (see scripts/vite-seo-plugin.mjs). The values below are the home page defaults. -->
    <!--seo:start-->
    <title>TaskFlow: Task Management App for Teams</title>
    <meta name="description" content="TaskFlow is an online task manager for teams: assign tasks, track time on a Kanban board, plan with a calendar and approve finished work." />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://taskflow.unimisk.com/" />
    <meta property="og:site_name" content="TaskFlow" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="TaskFlow: Task Management App for Teams" />
    <meta property="og:description" content="TaskFlow is an online task manager for teams: assign tasks, track time on a Kanban board, plan with a calendar and approve finished work." />
    <meta property="og:url" content="https://taskflow.unimisk.com/" />
    <meta property="og:image" content="https://taskflow.unimisk.com/icons/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="TaskFlow: Task Management App for Teams" />
    <meta name="twitter:description" content="TaskFlow is an online task manager for teams: assign tasks, track time on a Kanban board, plan with a calendar and approve finished work." />
    <meta name="twitter:image" content="https://taskflow.unimisk.com/icons/icon-512.png" />
    <!--seo:end-->
    <!-- Aggressive no-store hints so a stale CDN edge / browser cache can never
         serve the previous index.html. Asset filenames are content-hashed so
         this only ever affects the entrypoint document. -->
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts load without blocking the first paint (the critical CSS below already uses a system font until they arrive). -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" /></noscript>
    <!--
      Critical, deployment-resilient CSS.

      This block guarantees the marketing landing pages have a working layout
      EVEN IF the hashed Tailwind bundle is slow / cached / blocked by a CDN
      edge that hasn't picked up the latest build. It only sets the bare
      minimum that Tailwind utilities would otherwise be expected to provide.
      All values mirror the design tokens declared in src/index.css so light
      and dark mode still flip correctly via [data-theme] / .dark.
    -->
    <style id="taskflow-critical">
      :root {
        --background: #eaebed;
        --foreground: #020617;
        --card: #fbfbfd;
        --border: #e2e8f0;
        --muted: #475569;
        --accent: #f8fafc;
        --brand-primary: #8B5CF6;
        --brand-accent: #C084FC;
        color-scheme: light;
      }
      :root[data-theme="dark"], :root.dark {
        --background: #0b0e14;
        --foreground: #f8fafc;
        --card: #141820;
        --border: #1f2937;
        --muted: #94a3b8;
        --accent: #1e1b4b;
        color-scheme: dark;
      }
      *, *::before, *::after { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        background: var(--background);
        color: var(--foreground);
        font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: 16px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      h1, h2, h3, h4 {
        font-family: "Plus Jakarta Sans", "Inter", system-ui, sans-serif;
        font-weight: 600;
        letter-spacing: -0.025em;
        line-height: 1.15;
        margin: 0;
      }
      a { color: inherit; text-decoration: none; }
      button { font-family: inherit; }
      img, svg { display: block; max-width: 100%; }
      /* Spinner used during initial paint */
      .__pre_spinner {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        background: var(--background); z-index: 9999;
      }
      .__pre_spinner::after {
        content: ""; width: 24px; height: 24px; border-radius: 50%;
        border: 2px solid var(--border); border-top-color: var(--brand-primary);
        animation: __pre_spin 0.7s linear infinite;
      }
      @keyframes __pre_spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="__pre_spinner" aria-label="Loading TaskFlow"></div>
    </div>
    <!--seo:noscript-->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
