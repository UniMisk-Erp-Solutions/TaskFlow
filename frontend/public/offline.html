<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#5645d4" />
    <title>TaskFlow — Offline</title>
    <style>
      :root { color-scheme: light dark; --bg: #fafaf8; --fg: #0a1530; --muted: #5b6478; --card: #ffffff; --line: #e4e6ec; --brand: #5645d4; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0b0e14; --fg: #f1f3f9; --muted: #98a2b8; --card: #141820; --line: #232a38; --brand: #8b75ff; } }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--fg); font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
      main { width: 100%; max-width: 400px; text-align: center; background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 36px 28px; }
      img { width: 72px; height: 72px; border-radius: 18px; margin: 0 auto 18px; display: block; }
      h1 { margin: 0 0 8px; font-size: 22px; letter-spacing: -0.02em; }
      p { margin: 0 0 22px; color: var(--muted); line-height: 1.5; font-size: 15px; }
      button { appearance: none; border: 0; border-radius: 999px; padding: 11px 26px; background: var(--brand); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="TaskFlow" />
      <h1>You're offline</h1>
      <p>TaskFlow needs a connection to load your tasks, chat and files. Check your internet and try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
    <script>
      window.addEventListener('online', function () { location.reload(); });
    </script>
  </body>
</html>
