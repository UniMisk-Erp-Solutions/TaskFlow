# Jenkins Configuration as Code for the TaskFlow pipeline: the CORE configuration (always loaded).
# github.yaml (repository read credential + multibranch job) and local-verify.yaml (pre-GitHub job) are optional and
# only loaded when CASC_FILES lists them (see docker-compose.yml).
# Every ${VAR} below is REQUIRED: JCasC refuses to start when one is unset, so a missing secret fails loudly.
#
# TRUST MODEL
#   * The controller runs NO builds (0 executors) and holds NO signing key and NO GitHub write token.
#   * Branch/PR code is built only on the "untrusted" agent: a separate container with no secrets, no access to this
#     controller's files or credential store, and no route to the gate.
#   * Signing and GitHub statuses are done by the separate gate container (ci/gate-service), which re-verifies every build.
jenkins:
  systemMessage: "UniMisk CI — configured as code (ci/jenkins). Changes made in the UI are lost on restart."
  numExecutors: 0            # the controller never executes branch code
  globalNodeProperties:
    - envVars:
        env:
          - key: "CI_TOOLKIT_REF"        # the trusted ref the central pipeline takes ci/ and the lint/typecheck/E2E setup from
            value: "${CI_TOOLKIT_REF:-main}"
          - key: "MONITOR_URL"           # the production URL the scheduled health check GETs (optional)
            value: "${MONITOR_URL:-}"
  scmCheckoutRetryCount: 2
  mode: EXCLUSIVE
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "admin"
          password: "${JENKINS_ADMIN_PASSWORD}"
        - id: "developer"     # read-only: see jobs, stages and logs; cannot build, configure or see credentials
          password: "${trim:${readFile:${DEVELOPER_PASSWORD_FILE}}}"
        - id: "naveena246"      # branch developer: sees only their own branches (roleBased below)
          password: "${trim:${readFile:${DEV_USERS_PASSWORD_FILE}}}"
        - id: "salomi2810"      # branch developer: sees only their own branches (roleBased below)
          password: "${trim:${readFile:${DEV_USERS_PASSWORD_FILE}}}"
        - id: "lakshyabyteo"      # branch developer: sees only their own branches (roleBased below)
          password: "${trim:${readFile:${DEV_USERS_PASSWORD_FILE}}}"
        - id: "nikunjbyteo"      # branch developer: sees only their own branches (roleBased below)
          password: "${trim:${readFile:${DEV_USERS_PASSWORD_FILE}}}"
        - id: "jacktechie"      # branch developer: sees only their own branches (roleBased below)
          password: "${trim:${readFile:${DEV_USERS_PASSWORD_FILE}}}"
        - id: "unimisk-erp-solutions"      # ADMIN (organisation account): its own password file, never the shared developer password
          password: "${trim:${readFile:${UNIMISK_ADMIN_PASSWORD_FILE}}}"
        - id: "preet1249"      # branch developer: sees only their own branches (roleBased below)
          password: "${trim:${readFile:${DEV_USERS_PASSWORD_FILE}}}"
        - id: "gate"          # read jobs + start builds, nothing else (used by the gate container)
          password: "${trim:${readFile:${GATE_JENKINS_PASSWORD_FILE}}}"
  authorizationStrategy:
    # Role Strategy: every branch developer sees ONLY the jobs of branches that start with their GitHub username (or the
    # short form the team already uses, e.g. naveena/...). The job name of a branch is "taskflow/<branch with / as %2F>".
    # Patterns are case-insensitive. Anything that matches no role is invisible to that user.
    roleBased:
      roles:
        global:
          - name: "admin"
            description: "Full control"
            permissions: ["Overall/Administer"]
            entries:
              - user: "admin"
              - user: "unimisk-erp-solutions"
          - name: "authenticated"
            description: "Every logged-in user may open the UI; what they see is decided by the item roles"
            permissions: ["Overall/Read", "View/Read"]
            entries:
              - group: "authenticated"
        items:
          - name: "gate"
            description: "The gate container: read jobs and start builds, nothing else"
            pattern: ".*"
            permissions: ["Job/Read", "Job/Discover", "Job/Build"]
            entries:
              - user: "gate"
          - name: "read-only-all"
            description: "Shared read-only login that sees every job (kept for the team lead; not a branch developer)"
            pattern: ".*"
            permissions: ["Job/Read", "Job/Discover"]
            entries:
              - user: "developer"
          - name: "folder-visible"
            description: "The TaskFlow folder itself, so a developer can open it; it lists only the children they may read"
            pattern: "^taskflow$"
            permissions: ["Job/Read", "Job/Discover"]
            entries:
              - user: "naveena246"
              - user: "salomi2810"
              - user: "lakshyabyteo"
              - user: "nikunjbyteo"
              - user: "jacktechie"
              - user: "unimisk-erp-solutions"
              - user: "preet1249"
          - name: "branches-naveena246"
            description: "Branches of naveena246"
            pattern: "(?i)^taskflow/(naveena246|naveena)(%2F|/).*$"
            permissions: ["Job/Read", "Job/Discover"]
            entries:
              - user: "naveena246"
          - name: "branches-salomi2810"
            description: "Branches of salomi2810"
            pattern: "(?i)^taskflow/(salomi2810|salomi)(%2F|/).*$"
            permissions: ["Job/Read", "Job/Discover"]
            entries:
              - user: "salomi2810"
          - name: "branches-lakshyabyteo"
            description: "Branches of lakshyabyteo"
            pattern: "(?i)^taskflow/(lakshyabyteo|lakshya)(%2F|/).*$"
            permissions: ["Job/Read", "Job/Discover"]
            entries:
              - user: "lakshyabyteo"
          - name: "branches-nikunjbyteo"
            description: "Branches of nikunjbyteo"
            pattern: "(?i)^taskflow/(nikunjbyteo|nikunj)(%2F|/).*$"
            permissions: ["Job/Read", "Job/Discover"]
            entries:
              - user: "nikunjbyteo"
          - name: "branches-jacktechie"
            description: "Branches of jacktechie"
            pattern: "(?i)^taskflow/(jacktechie)(%2F|/).*$"
            permissions: ["Job/Read", "Job/Discover"]
            entries:
              - user: "jacktechie"
          - name: "branches-unimisk-erp-solutions"
            description: "Branches of unimisk-erp-solutions"
            pattern: "(?i)^taskflow/(unimisk-erp-solutions)(%2F|/).*$"
            permissions: ["Job/Read", "Job/Discover"]
            entries:
              - user: "unimisk-erp-solutions"
          - name: "branches-preet1249"
            description: "Branches of preet1249"
            pattern: "(?i)^taskflow/(preet1249|preet)(%2F|/).*$"
            permissions: ["Job/Read", "Job/Discover"]
            entries:
              - user: "preet1249"
  crumbIssuer: "standard"
  remotingSecurity:
    enabled: true
  nodes:
    - permanent:
        name: "untrusted-1"
        labelString: "untrusted"
        remoteFS: "/home/jenkins/agent"
        numExecutors: 1       # one build at a time keeps the shared host safe
        mode: EXCLUSIVE
        launcher:
          inbound:
            webSocket: true

security:
  queueItemAuthenticator:
    authenticators: []
  globalJobDslSecurityConfiguration:
    useScriptSecurity: true

unclassified:
  location:
    url: "${JENKINS_URL}"
  globalConfigFiles:
    configs:
      - custom:
          id: "taskflow-central-jenkinsfile"
          name: "TaskFlow central Jenkinsfile"
          comment: "Used for every branch without its own Jenkinsfile. Identical to the repository Jenkinsfile (enforced by a test)."
          content: "${readFile:/usr/share/jenkins/ref/casc/Jenkinsfile.central}"
