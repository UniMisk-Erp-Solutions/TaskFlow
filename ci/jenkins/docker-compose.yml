# CI for TaskFlow: three isolated containers, none of which can control other containers on the host.
#
#   jenkins  controller: schedules builds, 0 executors, no signing key, no GitHub write token
#   agent    "untrusted" build agent: runs branch code (npm scripts, tests, Playwright); NO secrets, own network
#   gate     webhook intake + independent verification + signing + GitHub statuses; holds the only keys
#
# Isolation guarantees (asserted by ci/tests/config.test.mjs):
#   * no /var/run/docker.sock and no privileged mode anywhere
#   * the agent shares no network with the gate and mounts no secret except its own agent secret
#   * published on 127.0.0.1 only (reach it through an SSH tunnel; expose ONLY the gate's port 8089 if a tunnel is approved)
#   * hard CPU / memory / pid limits
name: taskflow-ci

x-hardening: &hardening
  restart: unless-stopped
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  jenkins:
    <<: *hardening
    image: unimisk/taskflow-jenkins:2.580.1
    build:
      context: .
      args:
        DEBIAN_MIRROR: "${DEBIAN_MIRROR:-deb.debian.org}"
        JENKINS_UC_DOWNLOAD: "${JENKINS_UC_DOWNLOAD:-}"
    container_name: taskflow-jenkins
    ports:
      - "127.0.0.1:8088:8080"                                         # admin access: SSH tunnel to this loopback port, always
      - "${JENKINS_LAN_BIND:-127.0.0.1}:${JENKINS_LAN_PORT:-8081}:8080"   # developer dashboard: set JENKINS_LAN_BIND to the office-LAN address (never 0.0.0.0)
    environment:
      JENKINS_ADMIN_PASSWORD: "${JENKINS_ADMIN_PASSWORD:?set JENKINS_ADMIN_PASSWORD}"
      JENKINS_URL: "${JENKINS_URL:?set JENKINS_URL}"
      MONITOR_URL: "${MONITOR_URL:-}"
      CI_TOOLKIT_REF: "${CI_TOOLKIT_REF:-main}"   # trusted ref of the central pipeline (feature/ci-cd-pipeline until it is merged, then main)
      CASC_JENKINS_CONFIG: "${CASC_FILES:-/usr/share/jenkins/ref/casc/jenkins.yaml}"
      GATE_JENKINS_PASSWORD_FILE: /run/secrets/gate_jenkins_password
      DEVELOPER_PASSWORD_FILE: /run/secrets/developer_password
      DEV_USERS_PASSWORD_FILE: /run/secrets/dev_users_password
      UNIMISK_ADMIN_PASSWORD_FILE: /run/secrets/unimisk_admin_password
      GITHUB_READ_TOKEN_FILE: /run/secrets/github_read_token
      GITHUB_READ_USER: "${GITHUB_READ_USER:-unused}"
    secrets:
      - gate_jenkins_password
      - developer_password
      - dev_users_password
      - unimisk_admin_password
      - github_read_token
    volumes:
      - jenkins_home:/var/jenkins_home
      - "${GATE_PROJECT_SECRETS_PATH:?folder holding <project>/github-token and <project>/webhook-secret for each extra project (may be empty)}:/run/project-secrets:ro"
    networks: [taskflow_ci, taskflow_agent]
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 1.0
    pids_limit: 512
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/login >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s

  agent:
    <<: *hardening
    image: unimisk/taskflow-jenkins:2.580.1
    container_name: taskflow-agent
    init: true   # reaps finished child processes: without it every build leaves dead browser processes until the pid limit is hit and Chromium crashes
    entrypoint: ["java", "-jar", "/opt/agent.jar", "-url", "http://taskflow-jenkins:8080/", "-secret", "@/run/secrets/agent_secret", "-name", "untrusted-1", "-webSocket", "-workDir", "/home/jenkins/agent"]
    environment:
      HOME: /home/jenkins
      TRIVY_CACHE_DIR: /home/jenkins/agent/.trivy-cache
      NPM_CONFIG_CACHE: /home/jenkins/agent/.npm
    secrets:
      - agent_secret
    volumes:
      - agent_ws:/home/jenkins/agent
    networks: [taskflow_agent]
    mem_limit: 4g
    memswap_limit: 4g
    shm_size: "1gb"
    cpus: 2.0
    pids_limit: 1024
    depends_on: [jenkins]

  gate:
    <<: *hardening
    image: unimisk/taskflow-gate:1
    build:
      context: ../..
      dockerfile: ci/gate-service/Dockerfile
      args:
        DEBIAN_MIRROR: "${DEBIAN_MIRROR:-deb.debian.org}"
        GATE_PIN_JENKINSFILE: "${GATE_PIN_JENKINSFILE:?run ci/gate-service/pins.sh}"
        GATE_PIN_CI_PIPELINE: "${GATE_PIN_CI_PIPELINE:?run ci/gate-service/pins.sh}"
        GATE_PIN_CI_LIB: "${GATE_PIN_CI_LIB:?run ci/gate-service/pins.sh}"
        GATE_PIN_CI_GATE: "${GATE_PIN_CI_GATE:?run ci/gate-service/pins.sh}"
        GATE_PIN_CI_VERIFY: "${GATE_PIN_CI_VERIFY:?run ci/gate-service/pins.sh}"
    container_name: taskflow-gate
    ports:
      - "127.0.0.1:8089:8089"   # public listener: POST /github and GET /healthz only. The ONLY port a tunnel may point at.
      - "127.0.0.1:8090:8090"   # admin listener: status + attestations. Never expose.
    environment:
      GATE_REPO: "${GATE_REPO:-UniMisk-Erp-Solutions/TaskFlow}"
      GATE_GIT_SOURCE: "${GATE_GIT_SOURCE:?set GATE_GIT_SOURCE}"
      GATE_JENKINS_URL: http://taskflow-jenkins:8080
      GATE_DASHBOARD_URL: "${JENKINS_URL:?set JENKINS_URL}"   # GitHub status link target; ignored while it is a loopback address
      GATE_JENKINS_FOLDER: "${GATE_JENKINS_FOLDER:-taskflow-local}"   # single-project mode only; with a registry the folder of each project comes from it
      GATE_PROJECTS_FILE: "${GATE_PROJECTS_FILE:-}"                # /app/ci/projects.json = serve every project in the registry; empty = the single repository GATE_REPO
      GATE_PROJECT_SECRETS_DIR: /run/project-secrets               # <id>/webhook-secret (and optional <id>/github-token) for every project but the first
      GATE_STATUS_MODE: "${GATE_STATUS_MODE:-record}"
      GATE_WEBHOOK_SECRET_FILE: /run/secrets/gate_webhook_secret
      GATE_ATTEST_KEY_FILE: /run/secrets/attest_key
      GATE_JENKINS_PASSWORD_FILE: /run/secrets/gate_jenkins_password
      GATE_GITHUB_TOKEN_FILE: /run/secrets/gate_github_token
    secrets:
      - gate_webhook_secret
      - attest_key
      - gate_jenkins_password
      - gate_github_token
    volumes:
      - gate_state:/var/lib/gate
      - "${GATE_PROJECT_SECRETS_PATH:?folder holding <project>/webhook-secret for each extra project (may be empty)}:/run/project-secrets:ro"
    read_only: true
    tmpfs: [/tmp]
    networks: [taskflow_ci]
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    pids_limit: 256
    depends_on: [jenkins]

volumes:
  jenkins_home:
    name: taskflow_jenkins_home
  agent_ws:
    name: taskflow_agent_ws
  gate_state:
    name: taskflow_gate_state

networks:
  taskflow_ci:
    name: taskflow_ci
    driver: bridge
  taskflow_agent:
    name: taskflow_agent
    driver: bridge

secrets:
  unimisk_admin_password:
    file: "${UNIMISK_ADMIN_PASSWORD_PATH:?path to the password file of the unimisk-erp-solutions admin login}"
  dev_users_password:
    file: "${DEV_USERS_PASSWORD_PATH:?path to the password file of the per-branch developer logins}"
  developer_password:
    file: "${DEVELOPER_PASSWORD_PATH:?path to the read-only developer login password}"
  gate_jenkins_password:
    file: "${GATE_JENKINS_PASSWORD_PATH:?path to the gate user's Jenkins password}"
  github_read_token:
    file: "${GITHUB_READ_TOKEN_PATH:?path to the read-only GitHub token (placeholder until it exists)}"
  agent_secret:
    file: "${AGENT_SECRET_PATH:?path to the build agent secret}"
  gate_webhook_secret:
    file: "${GATE_WEBHOOK_SECRET_PATH:?path to the GitHub webhook secret}"
  attest_key:
    file: "${CI_ATTEST_PRIVATE_KEY_PATH:?path to the Ed25519 private key}"
  gate_github_token:
    file: "${GATE_GITHUB_TOKEN_PATH:?path to the commit-status token (placeholder in record mode)}"
