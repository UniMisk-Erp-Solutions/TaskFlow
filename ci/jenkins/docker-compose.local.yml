# Overlay for verifying the pipeline on Jenkins BEFORE the GitHub App exists:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.local.yml
# It only adds a read-only view of one repository directory and allows the Git plugin to check out from it.
# No port, no network, no capability and no secret is added; the base file's isolation applies unchanged.
services:
  jenkins:
    environment:
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=false -Xms256m -Xmx768m -Dhudson.plugins.git.GitSCM.ALLOW_LOCAL_CHECKOUT=true"
    volumes:
      - "${TASKFLOW_REPO_DIR:?set TASKFLOW_REPO_DIR to the repository clone}:/srv/taskflow-repo:ro"
