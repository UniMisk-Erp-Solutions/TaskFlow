# Overlay for verifying the pipeline BEFORE GitHub is connected:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.local.yml
# It only adds a read-only view of one repository clone (the stand-in for GitHub) to the controller, the agent and the
# gate, and lets the Git plugin check out from a local path. No port, network, capability or secret is added.
services:
  jenkins:
    environment:
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=false -Xms256m -Xmx768m -Dhudson.plugins.git.GitSCM.ALLOW_LOCAL_CHECKOUT=true"
    volumes:
      - "${TASKFLOW_REPO_DIR:?set TASKFLOW_REPO_DIR to the repository clone}:/srv/taskflow-repo:ro"
  agent:
    volumes:
      - "${TASKFLOW_REPO_DIR:?set TASKFLOW_REPO_DIR to the repository clone}:/srv/taskflow-repo:ro"
  gate:
    volumes:
      - "${TASKFLOW_REPO_DIR:?set TASKFLOW_REPO_DIR to the repository clone}:/srv/taskflow-repo:ro"
