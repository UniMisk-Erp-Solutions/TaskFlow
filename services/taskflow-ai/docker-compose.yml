# TaskFlow local AI stack - CPU only, hard-capped to TWO logical CPUs in total.
# Both containers share ONE cpuset (AI_CPUSET, exactly 2 logical CPU ids); the quotas below add up to 2.0.
# Nothing is published on the host: attach the external network `taskflow_ai` to the Supabase
# edge-functions container so only it can reach the planner.
# (The planner joins TaskFlow's Supabase network under the alias `taskflow-ai-planner`.)
name: taskflow-ai

services:
  llm:
    build: ./llm
    image: taskflow-ai-llm:local
    command:
      - --model
      - /models/${LLM_GGUF:-Qwen3-0.6B-Q8_0.gguf}
      - --alias
      - qwen3-0.6b
      - --host
      - 0.0.0.0
      - --port
      - "8081"
      - --threads
      - "2"
      - --threads-batch
      - "2"
      - --parallel
      - "1"
      - --ctx-size
      - "4096"
      - --api-key
      - ${LLAMA_API_KEY:?set LLAMA_API_KEY}
      - --no-webui
    cpuset: ${AI_CPUSET:?set AI_CPUSET to exactly 2 logical CPU ids, e.g. 2,3}
    cpus: 1.6
    mem_limit: 1g
    pids_limit: 128
    environment:
      OMP_NUM_THREADS: "2"
    volumes:
      - ${MODELS_DIR:-./models}/llm:/models:ro
    networks: [ai_internal]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8081/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  planner:
    build: ./planner
    environment:
      LLM_URL: http://llm:8081
      LLAMA_API_KEY: ${LLAMA_API_KEY}
      PLANNER_TOKEN: ${PLANNER_TOKEN:?set PLANNER_TOKEN}
      EMBEDDING_DIR: /models/e5
      EMBEDDING_FILE: model.onnx
      ONNX_INTRA_OP_THREADS: "1"
      ONNX_INTER_OP_THREADS: "1"
      OMP_NUM_THREADS: "1"
      OMP_THREAD_LIMIT: "1"
      MAX_LLM_QUEUE: "4"
      LLM_QUEUE_WAIT_SECONDS: "4"
      LLM_TIMEOUT_SECONDS: "40"
    cpuset: ${AI_CPUSET}
    cpus: 0.4
    mem_limit: 1280m
    pids_limit: 64
    volumes:
      - ${MODELS_DIR:-./models}/e5:/models/e5:ro
    networks:
      ai_internal: {}
      taskflow_net:
        aliases: [taskflow-ai-planner]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      llm:
        condition: service_healthy
    restart: unless-stopped

networks:
  ai_internal:
    internal: true
  # TaskFlow's own Supabase network, so only its edge function can reach the planner by name.
  taskflow_net:
    external: true
    name: ${TASKFLOW_NET:?set TASKFLOW_NET}
